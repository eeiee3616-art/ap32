<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP-32</title>
  <style>
    body{
      font-family: sans-serif;
      background:#f5f6fa;
      margin:0;
      padding:30px 16px;
      text-align:center;
    }
    .card{
      max-width:760px;
      margin:0 auto;
      background:#fff;
      padding:28px 18px 24px;
      border-radius:18px;
      box-shadow:0 6px 24px rgba(0,0,0,0.08);
    }
    .progress{
      font-size:14px;
      color:#666;
      margin-bottom:18px;
    }
    .bar-wrap{
      width:100%;
      height:10px;
      background:#e8e8e8;
      border-radius:999px;
      overflow:hidden;
      margin-bottom:24px;
    }
    .bar{
      height:100%;
      width:0%;
      background:#111;
      transition:width 0.25s ease;
    }
    .question-no{
      font-size:34px;
      font-weight:800;
      margin-bottom:18px;
    }
    .question-text{
      font-size:25px;
      line-height:1.5;
      font-weight:700;
      margin-bottom:30px;
      word-break:keep-all;
    }
    .answer-btn{
      width:100%;
      max-width:560px;
      display:block;
      margin:12px auto;
      padding:18px 16px;
      border:none;
      border-radius:14px;
      background:#111;
      color:#fff;
      font-size:21px;
      line-height:1.5;
      cursor:pointer;
      word-break:keep-all;
    }
    .answer-btn:hover{
      opacity:0.92;
    }
    .back-btn{
      width:100%;
      max-width:560px;
      display:block;
      margin:12px auto 0;
      padding:16px 14px;
      border:none;
      border-radius:14px;
      background:#666;
      color:#fff;
      font-size:18px;
      line-height:1.4;
      cursor:pointer;
    }
    .back-btn:disabled{
      opacity:0.45;
      cursor:default;
    }
    .sub-text{
      margin-top:18px;
      color:#777;
      font-size:14px;
    }
    @media (max-width: 480px){
      body{ padding:20px 12px; }
      .card{ padding:22px 14px 20px; }
      .question-no{ font-size:28px; }
      .question-text{ font-size:22px; }
      .answer-btn{ font-size:18px; padding:16px 14px; }
      .back-btn{ font-size:16px; padding:14px 12px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="progress" id="progressText">1 / 32</div>
    <div class="bar-wrap">
      <div class="bar" id="progressBar"></div>
    </div>

    <div class="question-no" id="questionNo">Q1</div>
    <div class="question-text" id="questionText">문항 내용</div>

    <button class="answer-btn" id="btnA" onclick="chooseAnswer('A')">A 선택지</button>
    <button class="answer-btn" id="btnB" onclick="chooseAnswer('B')">B 선택지</button>
    <button class="back-btn" id="prevBtn" onclick="goPrev()">← 이전 문항</button>

    <div class="sub-text">직감적으로 고르세요. / 최신버전</div>
  </div>

  <script>
    let questions = [
      { no: 1,  text: "새로운 보드게임을 처음 하게 됐다.", a: "규칙을 먼저 읽어본다", b: "일단 해보면서 익힌다", axis: 1, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no: 2,  text: "취미 활동이 재미있어지기 시작했다.", a: "그 활동을 더 깊게 배워 본다", b: "다른 활동도 함께 시도해본다", axis: 2, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no: 3,  text: "방법이 이미 알려져 있다.", a: "알려진 방법을 사용한다", b: "다른 방법을 시도해 본다", axis: 3, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no: 4,  text: "결과가 확실하지 않은 제안이다.", a: "가능성이 명확해질 때까지 보류한다", b: "불확실해도 시도해본다", axis: 4, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no: 5,  text: "모임이나 프로젝트를 시작하게 됐다.", a: "이미 정해진 방식에 맞춰 참여한다", b: "새로운 시작 방식이나 방향을 먼저 제안한다", axis: 5, dummy: false, bitValueA: 0, bitValueB: 1 },

      { no: 6,  text: "비 오는 날 시간을 보내야 한다.", a: "실내에서 보내는 것이 편하다", b: "밖으로 나가 분위기를 즐기는 것도 좋다", axis: 0, dummy: true, bitValueA: 0, bitValueB: 1 },
      { no: 7,  text: "진행 중 예상치 못한 문제가 생겼다.", a: "잠시 멈춰 원인을 확인한 뒤 이어간다", b: "하던 일을 계속하며 수정해 나간다", axis: 2, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no: 8,  text: "유튜브나 책에서 흥미로운 주제를 발견했다.", a: "그 주제를 더 깊게 파본다", b: "또 다른 흥미로운 주제가 있는지 찾아본다", axis: 3, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no: 9,  text: "규칙이 명확하지 않다.", a: "기존 방식에 맞춰 해석한다", b: "지금 상황에 맞게 정한다", axis: 4, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:10, text: "친구가 새로운 식당을 추천했다.", a: "리뷰나 정보를 조금 더 찾아본다", b: "일단 가서 직접 경험해 본다", axis: 5, dummy: false, bitValueA: 0, bitValueB: 1 },

      { no:11, text: "처음 해보는 활동을 시작하려 한다.", a: "먼저 하고 있는 사람들을 보며 따라간다", b: "내가 먼저 시작해 보거나 방법을 정한다", axis: 1, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:12, text: "마감이 다가오는데 계획이 어긋났다.", a: "잠시 멈춰 재정리한다", b: "하던 일을 유지하며 조정해 나간다", axis: 2, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:13, text: "강의를 들을 수 있는 기회가 생겼다.", a: "한 강의를 깊게 배워 본다", b: "여러 강의를 두루 들어 본다", axis: 3, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:14, text: "작업 결과를 확인할 때 나는.", a: "정해진 기준이나 체크 방식에 맞는지 먼저 본다", b: "내가 보기에도 충분히 잘 되었다고 느끼는지가 중요하다", axis: 4, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:15, text: "새로운 프로그램이나 앱을 처음 사용하게 됐다.", a: "전체 메뉴나 기능을 먼저 살펴본다", b: "일단 이것저것 눌러 보며 사용해 본다", axis: 5, dummy: false, bitValueA: 0, bitValueB: 1 },

      { no:16, text: "새로운 활동을 시작하려 한다.", a: "먼저 하고 있는 사람들을 참고하며 참여한다", b: "내가 먼저 시작해 보며 방향을 잡는다", axis: 1, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:17, text: "진행 중 작업 순서가 계속 변경된다.", a: "잠시 멈춰 다시 정리한다", b: "진행하면서 순서를 맞춰간다", axis: 2, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:18, text: "한 분야에서 성과가 나오기 시작했다.", a: "그 분야의 완성도를 더 높인다", b: "다른 영역에도 적용해 본다", axis: 3, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:19, text: "중요한 결정을 내려야 할 때", a: "객관적인 정보나 검증된 의견을 참고해 결정한다", b: "여러 의견을 듣지만 결국 내 판단을 따른다", axis: 4, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:20, text: "맛집을 가기로 했는데 웨이팅이 너무 길다.", a: "미리 생각해 둔 다른 식당으로 이동한다", b: "주변을 보거나 지도를 보며 새로운 곳을 찾는다", axis: 5, dummy: false, bitValueA: 0, bitValueB: 1 },

      { no:21, text: "단체 활동을 준비해야 하는 상황이다.", a: "이미 정해진 역할에 맞춰 참여한다", b: "이미 정해진 사람이 없다면 내가 먼저 맡아 시작한다", axis: 1, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:22, text: "글을 작성하던 중 일부 표현을 바꿔야 할 것 같다.", a: "잠시 멈춰 해당 부분을 먼저 정리한 뒤 이어간다", b: "일단 계속 작성한 뒤 나중에 수정한다", axis: 2, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:23, text: "어떤 방법이 예상보다 잘 통하고 있다.", a: "그 방법을 더 완성도 있게 만든다", b: "다른 일에도 적용해 본다", axis: 3, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:24, text: "이미 정해진 규칙이 있지만 다른 방식이 떠오른다.", a: "정해진 규칙대로 진행한다", b: "다른 방식을 제안한다", axis: 4, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:25, text: "가보지 않은 넓은 행사장에 처음 들어갔을 때 나는.", a: "입구에서 전체 지도나 동선을 먼저 확인한다", b: "눈에 띄는 곳부터 가보며 전체를 파악한다", axis: 5, dummy: false, bitValueA: 0, bitValueB: 1 },

      { no:26, text: "아무도 먼저 나서지 않는 상황이다.", a: "상황을 지켜보며 흐름에 맞춰 움직인다", b: "먼저 제안하거나 출발점을 만든다", axis: 1, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:27, text: "어떤 일을 진행하다 보면 아직 완벽하지 않은 상태가 되기도 한다.", a: "충분히 마무리한 뒤 다음 단계로 넘어간다", b: "어느 정도 진행되면 일단 다음 단계로 넘어간다", axis: 2, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:28, text: "주말에 자유 시간이 생겼다.", a: "미뤄 둔 한 가지 일을 먼저 끝낸다", b: "여러 하고 싶은 일을 조금씩 해본다", axis: 3, dummy: false, bitValueA: 0, bitValueB: 1 },
      { no:29, text: "한 번 본 영화나 드라마를 다시 볼 때.", a: "새로운 것을 보는 편이 좋다", b: "좋아하는 작품은 여러 번 봐도 괜찮다", axis: 0, dummy: true, bitValueA: 0, bitValueB: 1 },
      { no:30, text: "자신의 생각과 다른 의견이 제시된다.", a: "제시된 의견을 따른다", b: "자신의 의견을 제시한다", axis: 5, dummy: false, bitValueA: 0, bitValueB: 1 },

      { no:31, text: "처음 가보는 장소로 여행할 때 나는.", a: "미리 경로와 시간을 확인하고 계획을 세운다", b: "대략적인 방향만 정하고 상황에 맞게 움직인다", axis: 4, dummy: false, bitValueA: 0, bitValueB: 0 },
      { no:32, text: "함께 하기로 한 사람이 아직 확답을 주지 않았다.", a: "확답을 받을 때까지 기다린다", b: "확답 없이도 준비를 시작한다", axis: 5, dummy: false, bitValueA: 0, bitValueB: 0 }
    ];

    questions = [...questions].sort((a, b) => a.no - b.no);

    let currentIndex = 0;
    const answers = new Array(questions.length).fill(null);

    function renderQuestion() {
      const q = questions[currentIndex];

      document.getElementById("progressText").innerText = `${currentIndex + 1} / ${questions.length}`;
      document.getElementById("progressBar").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      document.getElementById("questionNo").innerText = `Q${q.no}`;
      document.getElementById("questionText").innerText = q.text;
      document.getElementById("btnA").innerText = `A. ${q.a}`;
      document.getElementById("btnB").innerText = `B. ${q.b}`;
      document.getElementById("prevBtn").disabled = currentIndex === 0;
    }

    function chooseAnswer(choice) {
      const q = questions[currentIndex];

      answers[currentIndex] = {
        no: q.no,
        axis: q.axis,
        dummy: q.dummy,
        choice: choice
      };

      currentIndex++;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        finishTest();
      }
    }

    function goPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function finishTest() {
      const axisScores = {
        1: [],
        2: [],
        3: [],
        4: [],
        5: []
      };

      for (const ans of answers) {
        if (!ans) continue;

        const q = questions.find(item => item.no === ans.no);
        if (!q || q.dummy) continue;

        if (ans.choice === "A") axisScores[q.axis].push(q.bitValueA);
        if (ans.choice === "B") axisScores[q.axis].push(q.bitValueB);
      }

      let typeCode = "";

      for (let axis = 1; axis <= 5; axis++) {
        const arr = axisScores[axis];
        const sum = arr.reduce((a, b) => a + b, 0);
        const bit = sum >= (arr.length / 2) ? 1 : 0;
        typeCode += String(bit);
      }

      localStorage.setItem("ap32_answers", JSON.stringify(answers));
      localStorage.setItem("ap32_type_code", typeCode);

      alert(`검사가 완료되었습니다.\n결과 코드: ${typeCode}`);
    }

    renderQuestion();
  </script>
</body>
</html>
